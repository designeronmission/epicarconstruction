<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404 Error</title>
    <!-- Favicon Icon -->
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo/fav-icon.png">
    <!-- Google Fonts Css-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Css -->
    <link href="css/bootstrap.min.css" rel="stylesheet" media="screen">
    <!-- SlickNav Css -->
    <link href="css/slicknav.min.css" rel="stylesheet">
    <!-- Swiper Css -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!-- Font Awesome Icon Css-->
    <link href="css/all.css" rel="stylesheet" media="screen">
    <!-- Animated Css -->
    <link href="css/animate.css" rel="stylesheet">
    <!-- Magnific Popup Core Css File -->
    <link rel="stylesheet" href="css/magnific-popup.css">
    <!-- Mouse Cursor Css File -->
    <link rel="stylesheet" href="css/mousecursor.css">
    <!-- Main Custom Css -->
    <link href="css/custom.css" rel="stylesheet" media="screen">


    <style>
     
        .error-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .error-image {
            max-width: 60%;
            height: auto;
            border-radius: 12px;
        
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        
        .error-image:hover {
            transform: translateY(-5px);
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 3px 3px 0 rgba(67, 97, 238, 0.1);
        }
        
        .error-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--dark-color);
        }
        
        .error-message {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .cta-button {
            padding: 0.85rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        
        .cta-button i {
            margin-right: 0.5rem;
        }
        
        .additional-options {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }
        
        .additional-options h5 {
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 1rem;
        }
        
        .option-link {
            display: inline-block;
            margin: 0 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .option-link:hover {
            background-color: rgba(67, 97, 238, 0.1);
            color: var(--secondary-color);
        }
        
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: #adb5bd;
            text-align: center;
        }
        
        /* Animation for the 404 text */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .error-code {
            animation: pulse 3s infinite ease-in-out;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .error-code {
                font-size: 4.5rem;
            }
            
            .error-title {
                font-size: 1.8rem;
            }
            
            .error-message {
                font-size: 1.1rem;
            }
            
            .cta-button {
                width: 100%;
                margin-bottom: 1rem;
            }
            
            .additional-options {
                text-align: center;
            }
            
            .option-link {
                margin: 0.3rem;
            }
        }
        
        @media (max-width: 576px) {
            .error-container {
                padding: 1rem;
            }
            
            .error-code {
                font-size: 3.5rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container text-center">
            <!-- Error Image -->
            <img src="assets/images/banner/404.png" 
                 alt="404 Page Not Found" 
                 class="error-image img-fluid">
            
            <!-- Error Title & Message -->
            <p class="error-message">
                We couldn’t find the page you’re looking for. It might have been moved, renamed, or never existed.
            </p>
            
            <!-- Primary CTA Button -->
            <a href="index.html" class="btn cta-button">
                <i class="fas fa-home"></i> Return to Homepage
            </a>
            
        </div>
    </div>
  <!-- Jquery Library File -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap js file -->
    <script src="js/bootstrap.min.js"></script>
    <!-- Validator js file -->
    <script src="js/validator.min.js"></script>
    <!-- SlickNav js file -->
    <script src="js/jquery.slicknav.js"></script>
    <!-- Swiper js file -->
    <script src="js/swiper-bundle.min.js"></script>
    <!-- Counter js file -->
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.counterup.min.js"></script>
    <!-- Magnific js file -->
    <script src="js/jquery.magnific-popup.min.js"></script>
    <!-- SmoothScroll -->
    <script src="js/SmoothScroll.js"></script>
    <!-- Parallax js -->
    <script src="js/parallaxie.js"></script>
    <!-- MagicCursor js file -->
    <script src="js/gsap.min.js"></script>
    <script src="js/magiccursor.js"></script>
    <!-- Text Effect js file -->
    <script src="js/SplitText.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <!-- Wow js file -->
    <script src="js/wow.js"></script>
    <!-- Main Custom js file -->
    <script src="js/function.js"></script>

    <!-- Main Custom js file -->
    <script src="js/index.js"></script>
    
    <script>
        // Add some interactive functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Make the "Go back" button work
            const goBackBtn = document.querySelector('.option-link:nth-child(2)');
            goBackBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.history.back();
            });
            
            // Animate the CTA button on hover
            const ctaButton = document.querySelector('.cta-button');
            ctaButton.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-3px) scale(1.02)';
            });
            
            ctaButton.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
            
            // Add a console message for fun
            console.log("404 Error: The page you're looking for is not here. But don't worry, we'll help you find your way!");
        });
    </script>
</body>
</html>
