<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Frame Layout</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
}

/* Frame Container */
.frame{
  position: relative;
  width: 100%;
  height: 700px;
  max-width: 550px;
  border-radius: 20px;
  overflow: hidden;
  background: #000;
}

/* Image */
.frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* STEP RECTANGLES */
.step{
  position:absolute;
  right:0;
  background:#111;
}

/* Step 1 */
.step1{
  top:0;
  width:65%;
  height:20%;
  border-bottom-left-radius:40px;
}

/* Step 2 */
.step2{
  top:20%;
  width:50%;
  height:20%;
  border-bottom-left-radius:40px;
}

/* Step 3 */
.step3{
  top:40%;
  width:32%;
  height:20%;
  border-bottom-left-radius:40px;
}

/* Step 4 */
.step4{
  top:60%;
  width:17%;
  height:20%;
}

/* Responsive Fix */
@media(max-width:992px){
  .frame{
    height:500px;
    margin:auto;
  }
}
</style>
</head>

<body>

<div class="container py-5">
  <div class="row align-items-center">
    
    <!-- Your col-lg-6 -->
    <div class="col-lg-6">
      <div class="frame">
        <img src="assets/images/works/commercial Construction.jpg" alt="preview">

        <div class="step step1"></div>
        <div class="step step2"></div>
        <div class="step step3"></div>
        <div class="step step4"></div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
